name: Auto Build & Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para actualizar la sección de Releases
    
    steps:
    - name: 📥 Clonar Repositorio
      uses: actions/checkout@v4
      
    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: 🔧 Dar permisos a Gradle
      run: chmod +x gradlew
      
    - name: 🔨 Compilar APK (Debug)
      run: ./gradlew clean assembleDebug
      
    - name: 📦 Renombrar APK
      run: mv app/build/outputs/apk/debug/app-debug.apk ApexMoney-Automated.apk
      
    - name: 🚀 Actualizar Release Continua (Latest)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "🔥 Última Versión Automática (Latest)"
        body: "Este APK se compila y sube automáticamente cada vez que se detectan cambios en el código (rama `main`)."
        files: ApexMoney-Automated.apk
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
