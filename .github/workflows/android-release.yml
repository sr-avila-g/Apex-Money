name: Auto Build & Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para actualizar la sección de Releases
    
    steps:
    - name: 📥 Clonar Repositorio
      uses: actions/checkout@v4
      
    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: 🔧 Dar permisos a Gradle
      run: chmod +x gradlew
      
    - name: 🔨 Compilar APK (Debug)
      run: ./gradlew clean assembleDebug
      
    - name: 📦 Renombrar APK
      run: mv app/build/outputs/apk/debug/app-debug.apk ApexMoney-Automated.apk
      
    - name: 🚀 Crear Release Automático
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "🚀 Build #${{ github.run_number }}"
        body: "Este APK se compiló automáticamente desde la rama `main`."
        files: ApexMoney-Automated.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
